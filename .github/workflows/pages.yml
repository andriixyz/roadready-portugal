name: Deploy RoadReady to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate question data
        run: npm run check

      - name: Validate cloud merge behaviour
        run: npm run check:sync

      - name: Validate question capture
        run: npm run check:capture

      - name: Validate question navigation
        run: npm run check:quiz

      - name: Cache public question images
        uses: actions/cache@v4
        with:
          path: public/images/questions
          key: question-images-v1-${{ hashFiles('public/data/questions-pt.json') }}

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
